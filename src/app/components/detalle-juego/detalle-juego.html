@if (juego) {
  <div class="detalle-container">
    <a class="btn-volver" [routerLink]="['/lista-juegos']">← Volver a la lista</a>
    <div class="detalle-card">
      <img [src]="juego.imagen" [alt]="juego.nombre" class="detalle-img">
      <div class="detalle-info">
        <h1>{{ juego.nombre }}</h1>
        <p class="meta">{{ juego.genero }} · {{ juego.anio }} · {{ juego.plataforma }}</p>
        <p class="rating">Rating: {{ juego.rating }} / 10</p>
        <p class="descripcion">{{ juego.descripcion }}</p>
      </div>
    </div>
  </div>
} @else {
  <div class="no-encontrado">
    <p>Pelicula no encontrada.</p>
    <a [routerLink]="['/lista-juegos']">← Volver a la lista</a>
  </div>
}
