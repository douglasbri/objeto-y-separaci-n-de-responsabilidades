<h1>Editar Figura</h1>

<app-info
    [posicionx]="posicionx"
    [posiciony]="posiciony"
    [tamano]="tamano"
    [color]="color"
    [visible]="visible">
</app-info>

<div class="lienzo">
    @if (visible) {
        <div class="figura"
            [style.left.px]="posicionx"
            [style.top.px]="posiciony"
            [style.width.px]="tamano"
            [style.height.px]="tamano"
            [style.backgroundColor]="color">
        </div>
    }
</div>

<div class="controles">
    <h3>Ubicación</h3>
    <button (click)="moverArriba()">Arriba</button>
    <button (click)="moverAbajo()">Abajo</button>
    <button (click)="moverIzquierda()">Izquierda</button>
    <button (click)="moverDerecha()">Derecha</button>
    <button (click)="moverDiagonal()">Diagonal ↘</button>
</div>

<div class="controles">
    <h3>Tamaño</h3>
    <button (click)="agrandar()">Aumentar</button>
    <button (click)="achicar()">Disminuir</button>
</div>

<div class="controles">
    <h3>Color</h3>
    <button class="rojo" (click)="cambiarColor('#ff0000')">Rojo</button>
    <button class="azul" (click)="cambiarColor('#4dabf7')">Azul</button>
</div>

<div class="controles">
    <h3>Visibilidad</h3>
    <button (click)="cambiarVisibilidad()">Cambiar Visibilidad</button>
</div>
