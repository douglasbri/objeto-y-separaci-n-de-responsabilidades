<div class="lista-container">
  <h1 class="titulo">Catalogo de Peliculas</h1>
  <div class="grid">
    @for (juego of juegos; track juego.id) {
      <div class="tarjeta">
        <img [src]="juego.imagen" [alt]="juego.nombre" class="tarjeta-img">
        <div class="tarjeta-info">
          <h2>{{ juego.nombre }}</h2>
          <p class="genero">{{ juego.genero }} · {{ juego.anio }}</p>
          <p class="descripcion">{{ juego.descripcion }}</p>
          <a class="btn-play" [routerLink]="['/detalle-juego', juego.nombre]">Ver pelicula</a>
        </div>
      </div>
    }
  </div>
</div>
